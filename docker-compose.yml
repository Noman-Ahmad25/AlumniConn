services:
  db:
    image: postgres:16-alpine
    container_name: app_postgres_db
    restart: always
    env_file:
      - ./server/.env
    environment:  
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - POSTGRES_DB=alumniconn       
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    env_file:
      - ./server/.env
    depends_on:
      - db
    restart: always

  client:  # Fixed: Shifted two spaces right to line up perfectly with server
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    command: npm run dev -- --host --strictPort
    depends_on:
      - server
    restart: always

volumes:
  postgres_data:
