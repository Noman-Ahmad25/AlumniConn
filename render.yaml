services:
  - type: web
    name: alumniconn-backend
    env: python
    buildCommand: "cd server && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd server && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alumniconn-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0 # Use 3.12 for stability on Render

databases:
  - name: alumniconn-db
    plan: free
